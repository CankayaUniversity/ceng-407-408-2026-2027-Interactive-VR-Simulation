<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" role="img"><title>Research progression, in experimental order; not a duration plot</title><rect width="1440" height="690" fill="#142b49"/><path d="M66 92V184" stroke="#7189a8" stroke-width="2"/><circle cx="66" cy="82" r="10" fill="#87c5cd"/><text x="105" y="89" fill="white" font-family="Arial,sans-serif" font-size="29" font-weight="700">Make inference work</text><text x="105" y="129" fill="#c2d4e8" font-family="Arial,sans-serif" font-size="22">Official example + isolated GPU setup</text><path d="M66 211V303" stroke="#7189a8" stroke-width="2"/><circle cx="66" cy="201" r="10" fill="#87c5cd"/><text x="105" y="208" fill="white" font-family="Arial,sans-serif" font-size="29" font-weight="700">Recognize the room</text><text x="105" y="248" fill="#c2d4e8" font-family="Arial,sans-serif" font-size="22">32 → 128 LingBot frames</text><path d="M66 330V422" stroke="#7189a8" stroke-width="2"/><circle cx="66" cy="320" r="10" fill="#87c5cd"/><text x="105" y="327" fill="white" font-family="Arial,sans-serif" font-size="29" font-weight="700">Compare camera poses</text><text x="105" y="367" fill="#c2d4e8" font-family="Arial,sans-serif" font-size="22">A/B Gaussian training, fixed cameras</text><path d="M66 449V541" stroke="#7189a8" stroke-width="2"/><circle cx="66" cy="439" r="10" fill="#87c5cd"/><text x="105" y="446" fill="white" font-family="Arial,sans-serif" font-size="29" font-weight="700">Challenge the capture</text><text x="105" y="486" fill="#c2d4e8" font-family="Arial,sans-serif" font-size="22">V2 movement + overlapping views</text><circle cx="66" cy="558" r="10" fill="#87c5cd"/><text x="105" y="565" fill="white" font-family="Arial,sans-serif" font-size="29" font-weight="700">Investigate sampling</text><text x="105" y="605" fill="#c2d4e8" font-family="Arial,sans-serif" font-size="22">364 frames, registration only</text><text x="105" y="659" fill="#c2d4e8" font-family="Arial,sans-serif" font-size="19">Experiments recorded 25–26 November 2026. Sequence shown; stage widths do not encode elapsed time.</text></svg>
