<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img"><title>From phone video to a training space: a monocular reconstruction research archive</title><rect width="1440" height="650" fill="#142b49"/><path d="M58 574H1382" stroke="#4a6384"/><text x="64" y="132" fill="#f6f9ff" font-family="Arial,sans-serif" font-size="75" font-weight="700">From a phone video</text><text x="64" y="218" fill="#f6f9ff" font-family="Arial,sans-serif" font-size="75" font-weight="700">to a training space.</text><text x="68" y="278" fill="#b6dfe4" font-family="Arial,sans-serif" font-size="25">A personal investigation into monocular 3D reconstruction.</text><rect x="66" y="332" width="1306" height="180" rx="4" fill="#1c3a5c" stroke="#6384a5" stroke-dasharray="8 8"/><text x="98" y="389" fill="#edf5ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">GENUINE EXPERIMENT IMAGE — PUBLICATION REVIEW PENDING</text><text x="98" y="431" fill="#c2d4e8" font-family="Arial,sans-serif" font-size="22">This is an explicitly labelled layout placeholder.</text><text x="98" y="468" fill="#c2d4e8" font-family="Arial,sans-serif" font-size="22">No synthetic room, invented reconstruction or unapproved private imagery.</text><text x="66" y="613" fill="#e2ecfa" font-family="Arial,sans-serif" font-size="19">LingBot-Map   /   COLMAP   /   3D Gaussian Splatting</text><text x="1155" y="613" fill="#b6dfe4" font-family="Arial,sans-serif" font-size="19">Research archive</text></svg>
