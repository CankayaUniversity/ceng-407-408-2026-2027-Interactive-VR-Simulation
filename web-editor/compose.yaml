services:
  frontend:
    build: .
    ports:
      - "127.0.0.1:5175:5173"
    environment:
      VITE_DOCKER_POLLING: "true"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"

volumes:
  frontend_node_modules:
